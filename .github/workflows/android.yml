name: Android APK
# Runs only when asked: from the Actions tab (Run workflow), or by pushing the commit to build to the `build` branch
# (git push origin main:build). Ordinary pushes to main do not start it.
on:
  workflow_dispatch:
  push:
    branches: [build]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node test/sim.test.js
      - run: node tools/build.js
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk string-theory.apk
      - uses: actions/upload-artifact@v4
        with: { name: string-theory-apk, path: string-theory.apk }
      # Publish the APK on its own branch so it can be fetched with plain git.
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          SHA=$(git rev-parse --short HEAD)
          git checkout --orphan apk
          git rm -rf -q --cached .
          git add -f string-theory.apk
          git commit -q -m "String Theory APK built from $SHA"
          git push -f origin apk
