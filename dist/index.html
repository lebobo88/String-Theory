<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1428">
<title>String Theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&amp;family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;family=Jacquard+24&amp;display=swap">
<style>
/* String Theory — interface. Thread card palette and type from the art bible. */
:root{
  --night:#0F1428;--coverlet:#18203D;--patch:#24305A;--mist:#8C9AC6;--linen:#E6DFD0;--paper:#F3EEE3;--ink:#1C2238;--ink2:#4A5170;
  --madder:#A82A33;--madder-pale:#E0726E;--saffron:#E3A93C;--saffron-ink:#7A4F08;--umber:#3A2C20;--brass:#9C7A3A;--rule:#B9AE96;--dot:#3D4F86;
  --display:'Jacquard 24','Courier New',monospace;--text:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',Verdana,sans-serif;--mono:'Atkinson Hyperlegible Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--linen);font-family:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;background:var(--linen);color:var(--ink);font-family:var(--mono);font-size:12px;font-weight:600;border-radius:4px;box-shadow:0 2px 0 var(--rule)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}.big{font-size:22px}.dim{color:var(--mist)}.small{font-size:13px}
.ic{display:inline-block;vertical-align:middle;overflow:visible;flex:none}
.lab,.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.lab{color:var(--saffron);margin:14px 0 4px}

/* ---- stage ---- */
#stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,calc(100vh*.78)) minmax(200px,1fr)}
#field{position:relative;min-width:0;min-height:0}
#cloth{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{padding:20px 22px;overflow:hidden;visibility:hidden;display:flex;flex-direction:column}
#hudL{align-items:flex-end;text-align:right}
body.flying .hud{visibility:visible}
.wm{font-family:var(--display);font-size:30px;color:var(--linen);line-height:1}
.score{font-family:var(--display);font-size:54px;line-height:.95;color:var(--linen)}
.nchart{border-collapse:separate;border-spacing:4px;margin-left:auto}
.nchart th{font:600 11px var(--mono);color:var(--mist);padding:0 2px}
.nchart td{width:26px;height:22px;border:1.5px dotted var(--dot)}
.nchart td.done{border:0;background:var(--patch) linear-gradient(135deg,transparent 44%,#CF4A4E 44% 56%,transparent 56%)}
.nchart td.done{background-image:linear-gradient(135deg,transparent 44%,#CF4A4E 44% 56%,transparent 56%),linear-gradient(45deg,transparent 44%,var(--madder) 44% 56%,transparent 56%)}
.nchart td.cur{border:1.5px dashed var(--saffron);background:rgba(227,169,60,.12)}
.hud hr{width:100%;border:0;border-top:1.5px dashed var(--dot);margin:14px 0 10px}
.thread{display:flex;align-items:center;gap:10px}.thread div{display:flex;flex-direction:column;text-align:left}.thread span{font-size:13px;color:var(--mist)}
#hudL .thread{flex-direction:row-reverse}#hudL .thread div{text-align:right}
.spool{display:inline-block;width:18px;height:26px;border-radius:3px;background:repeating-linear-gradient(0deg,var(--c) 0 3px,rgba(0,0,0,.25) 3px 4px);border-top:4px solid var(--brass);border-bottom:4px solid var(--brass);flex:none}
.combo{position:relative;margin-top:14px;padding:8px 10px;border:1.5px dashed var(--dot);min-width:150px;opacity:.45;display:flex;flex-direction:column;align-items:flex-end}
.combo.on{opacity:1;border-color:var(--saffron)}.combo .lab{margin:0}.combo b{font-family:var(--display);font-size:36px;line-height:1;color:var(--saffron)}
.combo i{position:absolute;left:0;bottom:0;height:3px;background:var(--saffron)}
.cushion{display:flex;gap:6px;min-height:30px;align-items:flex-end;padding:0 8px;border-bottom:10px solid var(--madder);border-radius:0 0 14px 14px;width:max-content;min-width:60px}
.cushion i{width:3px;height:26px;background:var(--linen);position:relative;transform:rotate(8deg)}.cushion i::before{content:'';position:absolute;top:-6px;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--saffron)}
.cushion i:nth-child(2n)::before{background:var(--madder-pale)}.cushion i:nth-child(2n){transform:rotate(-10deg)}
.bobbin{display:inline-flex;gap:3px;padding:0 6px;border-left:5px solid var(--brass);border-right:5px solid var(--brass);height:22px;align-items:stretch;vertical-align:middle}
.bobbin i{width:16px;border:1.5px dashed var(--mist)}
.bobbin i.on{border:0;background:repeating-linear-gradient(60deg,var(--madder) 0 4px,#7A1D27 4px 6px)}
.bobbin i.fray{border:0;background:repeating-linear-gradient(60deg,var(--madder-pale) 0 4px,var(--madder) 4px 6px);animation:fray .5s steps(2) infinite}
@keyframes fray{50%{transform:skewX(-8deg)}}
.cur{display:flex;align-items:center;gap:10px}
.fxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.fx{font-size:12px;font-weight:700;padding:3px 8px;border:1.5px dashed var(--c,var(--saffron));color:var(--linen)}
#tray{margin-top:auto}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{position:relative;width:60px;height:60px;border:1.5px dashed var(--dot);background:var(--coverlet);display:inline-flex;align-items:center;justify-content:center;padding:0}
.slot kbd{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);height:18px;min-width:18px;font-size:11px}
.slot em{position:absolute;top:2px;right:4px;font:600 12px var(--mono);font-style:normal;color:var(--saffron)}
.slot.txt{font-size:12px;font-weight:700;color:var(--mist)}
button.slot:active{border-color:var(--saffron)}
#mtop{display:none}
#bossbar{position:absolute;left:6%;right:6%;top:10px;pointer-events:none}
.bb{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;text-shadow:0 2px 0 var(--night)}
.bb b{font-family:var(--display);font-size:30px;font-weight:400}.bb span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--saffron)}
.seam{grid-column:1/-1;height:12px;background:repeating-linear-gradient(90deg,var(--dot) 0 3px,transparent 3px 8px) center/100% 2px no-repeat}
.seam i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--madder) 0 9px,transparent 9px 13px) center/100% 8px no-repeat;transition:width .15s}
#banner{position:absolute;left:0;right:0;top:36%;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:none}
.rib{background:var(--paper);color:var(--ink);padding:10px 34px;text-align:center;display:flex;flex-direction:column;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 50%,100% 100%,0 100%,14px 50%);box-shadow:0 0 0 2px var(--ink) inset}
.rib span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}.rib b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1}
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font:600 14px var(--mono);color:var(--linen);transform:translate(-50%,-50%);animation:fl .8s ease-out forwards;text-shadow:0 1px 0 var(--night)}
.fl.hot{color:var(--saffron);font-size:17px}.fl.silk{color:var(--paper)}
@keyframes fl{to{transform:translate(-50%,-190%);opacity:0}}
#toasts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:30;width:min(92vw,420px)}
.toast{background:var(--paper);color:var(--ink);padding:8px 14px;border:1.5px dashed var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;animation:tin .2s ease-out;transition:opacity .4s}
.toast b{font-size:15px}.toast span{font-size:13px;color:var(--ink2)}.toast.out{opacity:0}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

/* ---- overlay screens ---- */
.overlay{position:fixed;inset:0;display:none;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.overlay.on{display:flex;align-items:flex-start;justify-content:center}
.overlay.night{background:rgba(15,20,40,.86)}
.overlay.paper{background:rgba(15,20,40,.8)}
.eyebrow{color:var(--ink2)}
.paper .dim{color:var(--ink2)}
.night .eyebrow{color:var(--mist)}
.title{margin:auto;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.wordmark{font-family:var(--display);font-weight:400;font-size:clamp(64px,16vw,128px);line-height:.85;margin:0;color:var(--linen);text-shadow:0 4px 0 var(--madder)}
.lede{font-size:17px;line-height:1.45;margin:0;color:inherit}
.night .lede{color:var(--mist)}
.stack{display:flex;flex-direction:column;gap:10px;width:min(100%,320px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{min-height:48px;padding:0 22px;font-size:17px;font-weight:700;background:transparent;border:2px dashed currentColor;color:inherit}
.btn.primary{background:var(--madder);color:var(--paper);border:2px solid var(--madder);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3.5px var(--madder) inset}
.btn:focus-visible,.card:focus-visible,.tabb:focus-visible,.node:focus-visible,.chip:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.btn:disabled{opacity:.45}
.chip{min-height:44px;padding:0 14px;font-size:14px;font-weight:700;background:transparent;border:1.5px dashed var(--mist);color:var(--mist)}
.paper .chip{border-color:var(--ink2);color:var(--ink2)}.chip.danger{color:var(--madder-pale);border-color:var(--madder-pale)}
.tag{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 18px;background:var(--paper);color:var(--ink);clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);font-family:var(--mono);font-size:15px;vertical-align:middle}
.sheet,.hem{background:var(--linen);color:var(--ink);background-image:linear-gradient(rgba(28,34,56,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(28,34,56,.06) 1px,transparent 1px);background-size:12px 12px;margin:auto;box-shadow:0 0 0 6px var(--umber),0 18px 50px rgba(0,0,0,.5)}
.sheet{width:min(100%,640px);padding:28px;display:flex;flex-direction:column;gap:14px}.sheet.narrow{width:min(100%,380px)}
.sheet h2,.hem h2{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,60px);line-height:.95;margin:0}
h2.madder{color:var(--madder)}
.sheet p{margin:0;line-height:1.45;font-size:16px}
.tally{margin:0;border-top:2px dashed var(--ink)}
.tally div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1.5px dotted var(--rule)}
.tally dt{font-size:15px;color:var(--ink2)}.tally dd{margin:0;font:600 17px var(--mono);display:flex;align-items:center;gap:6px}
.how{display:grid;gap:8px}.how div{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px 0;border-bottom:1.5px dotted var(--rule);align-items:center}.how span{color:var(--ink2);font-size:15px}
.pocket{background:var(--umber);padding:12px;display:flex;flex-direction:column;gap:8px}.pocket .eyebrow{color:var(--rule)}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pk .card{flex-direction:column;align-items:flex-start;height:auto;gap:6px}.pk .cmeta{text-align:left;font-size:13px;color:var(--ink2)}
.hem{width:min(100%,1040px);padding:22px;display:flex;flex-direction:column;gap:14px}
.hem header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px dashed var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabb{flex:1 0 auto;min-height:52px;padding:6px 12px;background:transparent;border:1.5px dashed var(--rule);display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.tabb b{font-size:15px}.tabb span{font-size:12px;color:var(--ink2)}
.tabb.on{background:var(--ink);color:var(--paper);border:1.5px solid var(--ink)}.tabb.on span{color:var(--rule)}
.station{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 10px;background:var(--paper);border:1.5px solid transparent;border-bottom:1.5px dotted var(--rule);text-align:left;width:100%}
.card.sel{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3.5px var(--ink) inset}
.card.dim{opacity:.55}.card:disabled{opacity:.5}
.cic{width:44px;display:inline-flex;justify-content:center;flex:none}.cname{font-weight:700;font-size:16px;flex:1}.cmeta{font-size:13px;color:var(--ink2);text-align:right}
.detail{background:var(--paper);padding:18px;border:1.5px dashed var(--ink);display:flex;flex-direction:column;gap:10px}
.detail h3{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0}.detail p{margin:0;font-size:16px;line-height:1.45}
.quote{font-style:italic;color:var(--ink2);font-size:14px !important}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.state{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.state.sealed{color:var(--ink2)}.state.short{color:var(--madder)}.state.own{color:var(--saffron-ink)}
.weights{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}.weights li{padding:5px 8px;border:1.5px dashed var(--rule);font-size:14px;color:var(--ink2)}
.weights li.on{border:1.5px solid var(--madder);color:var(--ink)}.weights b{font-family:var(--mono);margin-right:6px}
.pips{display:inline-flex;gap:3px}.pips i{width:11px;height:11px;border:1.5px dashed var(--rule)}.pips i.on{border:0;background:linear-gradient(45deg,transparent 40%,var(--madder) 40% 60%,transparent 60%),linear-gradient(135deg,transparent 40%,#CF4A4E 40% 60%,transparent 60%)}
.stats{display:grid;gap:5px}.stats div{display:grid;grid-template-columns:60px auto 1fr;gap:10px;align-items:center}.stats span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}.stats em{font-style:normal;color:var(--saffron-ink)}
.trayrow{display:flex;gap:10px;align-items:center}.trayrow .slot{width:52px;height:52px;background:var(--linen);border-color:var(--ink2)}
.sampler{display:flex;flex-direction:column;gap:8px}.srow{display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.node{min-height:56px;padding:6px 8px;background:var(--paper);border:1.5px dashed var(--rule);display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.node b{font-size:14px}.node span{font:600 12px var(--mono);color:var(--ink2)}
.node.done{border:1.5px solid var(--madder)}.node.done span{color:var(--madder)}.node.lock{opacity:.5}.node.sel{box-shadow:0 0 0 2px var(--paper) inset,0 0 0 3.5px var(--ink) inset;border:2px solid var(--ink)}
.book{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.book section{display:flex;flex-direction:column;gap:6px}.book .eyebrow{margin-top:8px}
.entry{display:flex;gap:12px;align-items:center;background:var(--coverlet);color:var(--linen);padding:8px 12px;min-height:56px}
.entry div{display:flex;flex-direction:column}.entry span{font-size:13px;color:var(--mist)}.entry.unseen .ic{filter:brightness(0) opacity(.5)}.entry.unseen b{color:var(--mist);font-weight:400}
.hem footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:2px dashed var(--ink)}
.purse{justify-content:flex-start}

/* ---- phones and narrow windows: the cloth fills the screen, HUD folds onto it ---- */
@media (max-width: 860px), (max-aspect-ratio: 1/1){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr}
  #hudL,#hudR{display:none}
  .hud{position:absolute;left:0;right:0;bottom:0;padding:0 10px calc(14px + env(safe-area-inset-bottom));z-index:5;pointer-events:none;background:linear-gradient(transparent,rgba(15,20,40,.75))}
  #tray{pointer-events:auto}#tray .lab{display:none}.slots{justify-content:center}
  #mtop{display:flex;position:absolute;left:0;right:0;top:0;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(rgba(15,20,40,.85),transparent);pointer-events:none;visibility:hidden}
  body.flying #mtop{visibility:visible}
  #mtop .score{font-size:30px}#mtop .tag{height:24px;font-size:13px}#mtop .fxs{margin:0;flex-basis:100%}.mcombo{font-family:var(--display);font-size:26px;color:var(--saffron)}
  #bossbar{top:calc(58px + env(safe-area-inset-top))}.bb b{font-size:24px}
  .station{grid-template-columns:1fr}.hem{padding:14px}.sheet{padding:20px}
  .srow{grid-template-columns:1fr 1fr 1fr}.srow .eyebrow{grid-column:1/-1}
}
@media (prefers-reduced-motion: reduce){.fl,.toast,.bobbin i.fray{animation:none}#banner{transition:none}}

/* ---- pockets, route, ledger ---- */
.sheet.wide{width:min(100%,900px)}
.pockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pcard{min-height:230px;padding:16px 14px;background:var(--paper);border:1.5px dashed var(--rule);border-radius:0 0 46px 46px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.pcard.sel{border:2px solid var(--saffron-ink);box-shadow:0 0 0 3px var(--saffron) inset}
.pcard.empty{align-items:center;justify-content:center;text-align:center;color:var(--ink2)}
.pname{font-family:var(--display);font-weight:400;font-size:34px;line-height:1}.pneedles{display:flex;gap:6px;min-height:28px;align-items:flex-end}
.pcard dl{margin:4px 0 0;width:100%}.pcard dl div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1.5px dotted var(--rule);font-size:13px}.pcard dt{color:var(--ink2)}.pcard dd{margin:0;font:600 13px var(--mono)}
.namer{display:flex;flex-direction:column;gap:4px}.namer input{min-height:48px;padding:0 12px;font:700 17px var(--text);background:var(--paper);color:var(--ink);border:2px dashed var(--ink);width:200px}
.btn.danger{color:var(--madder)}
.routewrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.routemap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--coverlet);padding:14px 10px;min-height:300px;align-items:center}
.rcol{display:flex;flex-direction:column;gap:14px;align-items:center}.rcol .eyebrow{color:var(--mist)}.rcol.future{opacity:.55}
.ptile{width:100%;max-width:120px;background:transparent;border:0;padding:0;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--linen)}
.ptile i{display:block;width:100%;aspect-ratio:1;border:2px dashed var(--mist);background-color:var(--patch)}
.ptile b{font-size:13px}.ptile.open i{border-color:var(--linen)}.ptile.flown i{border:2px solid var(--madder)}.ptile.sel i{border:2px solid var(--saffron);box-shadow:0 0 0 3px var(--coverlet),0 0 0 5px var(--saffron)}
.art-selvage i{background-image:linear-gradient(90deg,transparent 18%,var(--linen) 18% 21%,transparent 21%),repeating-linear-gradient(0deg,transparent 0 7px,rgba(230,223,208,.25) 7px 8px)}
.art-holes i{background-image:radial-gradient(circle at 30% 35%,var(--night) 0 12%,transparent 13%),radial-gradient(circle at 68% 60%,var(--night) 0 16%,transparent 17%),radial-gradient(circle at 40% 78%,var(--night) 0 8%,transparent 9%)}
.art-darn i{background-image:repeating-linear-gradient(0deg,rgba(230,223,208,.5) 0 2px,transparent 2px 7px),repeating-linear-gradient(90deg,rgba(168,42,51,.7) 0 2px,transparent 2px 7px)}
.art-boro i{background-image:linear-gradient(var(--coverlet),var(--coverlet)),linear-gradient(#1D2749,#1D2749);background-size:55% 50%,50% 55%;background-position:15% 20%,80% 78%;background-repeat:no-repeat;outline:2px dashed rgba(230,223,208,.35);outline-offset:-10px}
.art-eyes i{background-image:radial-gradient(circle 16px at 30% 50%,#FFF4D6 0,#FFF4D6 5px,#A82A33 6px,#A82A33 15px,transparent 16px),radial-gradient(circle 16px at 70% 50%,#FFF4D6 0,#FFF4D6 5px,#A82A33 6px,#A82A33 15px,transparent 16px)}
.art-lines i{background-image:repeating-linear-gradient(0deg,transparent 0 12px,var(--saffron) 12px 14px);background-size:60% 100%;background-position:center;background-repeat:no-repeat}
.art-fringe i{background-image:linear-gradient(var(--linen) 0 22%,transparent 22%),repeating-linear-gradient(90deg,var(--linen) 0 2px,transparent 2px 9px);background-size:100% 100%,100% 75%;background-repeat:no-repeat}
.hemline{background:var(--umber);color:var(--rule);text-align:center;padding:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.mark{color:var(--saffron-ink) !important;font-family:var(--text) !important;font-size:14px !important;text-align:right}
.tablewrap{overflow-x:auto}.ledger{width:100%;border-collapse:collapse;background:var(--paper)}
.ledger th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px;border-bottom:2px dashed var(--ink)}
.ledger td{padding:8px;border-bottom:1.5px dotted var(--rule);font-size:14px}.ledger tr.me td{background:rgba(227,169,60,.18)}.ledger td.won{color:var(--saffron-ink);font-weight:700}
.nchart td{width:22px;height:18px}
@media (max-width: 860px), (max-aspect-ratio: 1/1){ .pockets{grid-template-columns:1fr}.pcard{min-height:0;border-radius:0 0 24px 24px}.routewrap{grid-template-columns:1fr} }

      if (m.wicks) sp.wickEvery = Math.min(sp.wickEvery || 99, m.wicks);
      if (m.hawks) sp.hawks = (sp.hawks || 0) + m.hawks;
      return sp;
    }
    startStage() {
      this.events.length = 0;
      this.clearField();
      this.refit();
      const pd = C.PANELS[this.panel];
      this.stage = { stitches0: this.stitches, dust0: this.nightDust, silk0: this.nightSilk, hurt: false, best: 0, charts: [] };
      this.palmUsed = false;
      if (this.p.pattern.mended && this.player.ply < this.d.ply) this.player.ply++;
      this.player.x = 0; this.player.invuln = 1.5; this.player.charge = 0;
      const kind = C.STAGES[this.row];
      if (kind === 'row') this.buildRow(this.rowSpec()); else if (kind === 'sampler') this.buildSampler(); else this.buildKeeper(pd.keeper);
      this.phase = 'intro'; this.phaseT = 1.8;
      this.emit('stage', this.stageInfo());
    }
    advance() {      // after a tally: what comes next
      if (this.row < C.STAGES.length - 1) { this.row++; return C.STAGES[this.row]; }
      this.row = 0; this.panel++;
      if (this.panel >= C.PANELS.length) { this.panel = C.PANELS.length - 1; return 'won'; }
      return 'hem';
    }

    // ---------- building a Row ----------
    slotPos(e) { return { x: e.sx + Math.sin(this.t * 0.7) * 0.8, y: e.sy + Math.sin(this.t * 1.3 + e.sx) * 0.08 }; }
    spawn(type, o) {
      const def = C.MOTHS[type];
      const e = Object.assign({ id: this.nextId++, type, def, hp: def.hp, r: def.r, x: 0, y: H + 2, state: 'form', t: 0, vx: 0,
        slot: false, cased: !!def.cased, shotT: this.rr(0.4, 1.2), flap: this.rand() * 6, passes: 0 }, o);
      this.enemies.push(e); return e;
    }
    buildRow(spec) {
      const lay = [[spec.spinners, 'spinner'], [spec.mids, 'casebearer'], [spec.mids, 'casebearer'], [spec.nibs, 'nibbler'], [spec.nibs, 'nibbler']];
      let k = 0, m = 0, nb = 0;
      lay.forEach(([n, type], ri) => {
        for (let i = 0; i < n; i++) {
          let ty = type;
          if (type === 'casebearer' && spec.lappetEvery && (++m % spec.lappetEvery) === 0) ty = 'lappet';
          if (type === 'nibbler' && spec.wickEvery && (++nb % spec.wickEvery) === 0) ty = 'wick';
          const sx = (i - (n - 1) / 2) * 1.2, sy = ROWS_Y[ri];
          const side = (i < n / 2) ? -1 : 1;
          this.spawn(ty, { slot: true, sx, sy, row: ri, state: 'enter', t: -(k * 0.07 + ri * 0.25),
            ex: side * (HW + 2), ey: H - 3 - ri, cx: side * 2.5, cy: 5 + ri });
          k++;
        }
      });
      this.extras = [];
      for (let i = 0; i < (spec.hawks || 0); i++) this.extras.push('hawk');
      for (let i = 0; i < (spec.loopers || 0); i++) this.extras.push('looper');
      // shuffle extras deterministically
      for (let i = this.extras.length - 1; i > 0; i--) { const j = Math.floor(this.rand() * (i + 1)); [this.extras[i], this.extras[j]] = [this.extras[j], this.extras[i]]; }
      this.spec = spec;
    }
    buildSampler() {
      const S = C.SAMPLER, pattern = this.mods().sampler || C.PANELS[this.panel].sampler;
      this.sampler = { total: S.count, hit: 0, out: 0, pattern };
      for (let i = 0; i < S.count; i++) this.spawn(S.order[i % S.order.length], { state: 'trace', t: -i * S.gap, pattern, x: HW + 2, y: H + 2 });
      this.spec = { diveEvery: 99, fireEvery: 99 };
    }
    /* Sampler patterns, u in 0..1 around one closed figure. The rosette is the bible's quatrefoil. */
    pathPoint(name, u) {
      const cy = 10.33, P = Math.PI;
      if (name === 'rosette') {
        const s = (u * 4 + 0.5) % 4, k = Math.floor(s), f = s - k, hz = k % 2 === 0;
        const along = (hz ? 4.72 : 3.78) * Math.sin(P * f), across = (hz ? 1.03 : 1.29) * Math.sin(2 * P * f);
        return k === 0 ? { x: along, y: cy + across } : k === 1 ? { x: -across, y: cy + along } : k === 2 ? { x: -along, y: cy - across } : { x: across, y: cy - along };
      }
      if (name === 'eight') return { x: 5 * Math.sin(2 * P * u), y: cy + 3 * Math.sin(4 * P * u) };
      return { x: 5.5 * Math.cos(2 * P * u), y: cy + 2.4 * Math.sin(6 * P * u) };
    }
    buildKeeper(id) {
      const def = C.KEEPERS[id];
      this.boss = { id, def, x: 0, y: H + 4, hp: def.hp, maxHp: def.hp, t: 0, phase: 1, enter: 2.2, a: 0, b: 0, c: 0, open: false, flash: 0 };
      this.spec = { diveEvery: 99, fireEvery: 99 };
    }

    // ---------- per-frame update ----------
    update(dt, input) {
      this.events.length = 0;
      if (this.phase === 'idle' || this.phase === 'done') return;
      dt = Math.min(dt, 0.05);
      this.t += dt;
      const slow = this.fx.tangle > 0 ? 0.45 : 1;
      for (const k in this.fx) if (this.fx[k] > 0) this.fx[k] = Math.max(0, this.fx[k] - dt);
      if (this.combo > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }

      if (this.phase === 'intro') { this.phaseT -= dt; if (this.phaseT <= 0) this.phase = 'play'; }
      this.updatePlayer(dt, input);
      this.updateShots(dt);
      this.updateEnemies(dt * slow, dt);
      if (this.boss) this.updateBoss(dt * slow);
      this.updateEshots(dt * slow);
      this.updateHazards(dt);
      this.updateDrops(dt);

      if (this.phase === 'play') {
        const fieldEmpty = this.enemies.length === 0 && !this.boss;
        if (fieldEmpty) { this.phase = 'clear'; this.phaseT = 1.6; this.eshots.length = 0; this.nets.length = 0; this.hazards.length = 0; }
      } else if (this.phase === 'clear') {
        this.phaseT -= dt;
        if (this.phaseT <= 0 && this.drops.length === 0) this.finishStage();
      } else if (this.phase === 'dying') {
        this.phaseT -= dt;
        if (this.phaseT <= 0) this.finishSnap();
      }
    }

    // ---------- player ----------
    curThread() { return this.p.threads[this.p.thread] ? this.p.thread : 'running'; }
    updatePlayer(dt, input) {
      const pl = this.player, d = this.d;
      if (this.phase === 'dying') return;
      pl.invuln = Math.max(0, pl.invuln - dt);
      pl.dashCd = Math.max(0, pl.dashCd - dt);
      const thread = this.curThread();
      const charging = thread === 'couching' && pl.charge > 0;
      let speed = d.speed * (charging ? 0.5 : 1);
      if (input.dash && d.dash && pl.dashCd <= 0) { pl.dashT = 0.12; pl.dashDir = input.dash; pl.dashCd = 0.7; pl.invuln = Math.max(pl.invuln, 0.2); this.emit('dash'); }
      if (pl.dashT > 0) { pl.dashT -= dt; pl.x += pl.dashDir * (2 / 0.12) * dt; }
      else if (input.targetX !== null && input.targetX !== undefined) {
        const dx = input.targetX - pl.x; pl.x += clamp(dx, -speed * dt, speed * dt);
      } else pl.x += (input.move || 0) * speed * dt;
      if (this.boss && this.boss.id === 'unraveller' && this.boss.phase === 3 && !this.boss.enter) pl.x += Math.sign(this.boss.x - pl.x) * 1.5 * dt;
      const lim = HW - 0.5 - (pl.dual ? 0.45 : 0);
      pl.x = clamp(pl.x, -lim, lim);

      if (input.swap && d.bigEye && this.p.thread2 && this.p.threads[this.p.thread2]) {
        const a = this.p.thread; this.p.thread = this.p.thread2; this.p.thread2 = a; pl.charge = 0; this.emit('swap', { thread: this.p.thread });
      }
      if (input.notion !== undefined && input.notion >= 0) this.useNotion(input.notion);

      // stitching
      if (this.phase !== 'play') { pl.charge = 0; return; }
      const th = C.THREADS[thread], w = this.p.threads[thread] || 1;
      const rateMul = d.fireMul * (this.fx.beeswax > 0 ? 2 : 1) * (this.fx.bobbin > 0 ? 1.6 : 1);
      pl.fireT -= dt;
      if (thread === 'couching') {
        if (input.fire && pl.fireT <= 0) {
          pl.charge += dt * rateMul;
          if (pl.charge >= th.rate[w - 1]) { pl.charge = 0; pl.fireT = 0.35; this.fire(thread, w); }
        } else if (!input.fire) pl.charge = 0;
      } else if (input.fire && pl.fireT <= 0) {
        pl.fireT = th.rate[w - 1] / rateMul;
        this.fire(thread, w);
      }
    }
    fire(thread, w) {
      const pl = this.player, d = this.d;
      const origins = pl.dual ? [-0.45, 0.45] : [0];
      const basePierce = d.pierce + (this.fx.staple > 0 ? 99 : 0);
      const extras = (d.wide ? 1 : 0) + (this.fx.fan > 0 ? 1 : 0);
      const add = (ox, o) => this.shots.push(Object.assign({ id: this.nextId++, x: pl.x + ox, y: PY + 0.7, vx: 0, vy: 17, dmg: d.dmg, pierce: basePierce, kind: thread, hit: null, t: 0 }, o));
      const ang = (deg, sp) => ({ vx: Math.sin(deg * Math.PI / 180) * sp, vy: Math.cos(deg * Math.PI / 180) * sp });
      let spread = 8;
      for (const ox of origins) {
        if (thread === 'running') add(ox, { pierce: basePierce + (w >= 3 ? 1 : 0) });
        else if (thread === 'backstitch') { const n = w >= 3 ? 3 : 2; for (let i = 0; i < n; i++) add(ox + (i - (n - 1) / 2) * 0.34, {}); }
        else if (thread === 'herringbone') {
          const n = w >= 3 ? 5 : 3, sp = w >= 3 ? 30 : 20; spread = sp;
          for (let i = 0; i < n; i++) add(ox, Object.assign({ zig: 1, dmg: d.dmg * 0.8 }, ang((i / (n - 1) - 0.5) * sp, 15)));
        }
        else if (thread === 'chain') add(ox, { chain: w >= 2 ? 2 : 1, chainDmg: w >= 3 ? 1 : 0.6, vy: 15 });
        else if (thread === 'knot') add(ox, { vy: 8, burst: w >= 2 ? 2.5 : 1.5, dmg: d.dmg * 1.6, r: 0.3 });
        else if (thread === 'couching') this.lance(pl.x + ox, w >= 3 ? 1.0 : 0.5, d.dmg * 3.2);
        for (let k = 1; k <= extras; k++) {
          const a = spread / 2 + 9 * k;
          add(ox, Object.assign({ dmg: d.dmg * 0.6, kind: 'fan' }, ang(-a, 16)));
          add(ox, Object.assign({ dmg: d.dmg * 0.6, kind: 'fan' }, ang(a, 16)));
        }
      }
      this.emit('fire', { thread });
    }
    lance(x, halfW, dmg) {
      this.emit('lance', { x, w: halfW * 2 });
      for (const e of this.enemies.slice()) if (Math.abs(e.x - x) < halfW + e.r && e.y > PY) this.damageEnemy(e, dmg, true);
      for (let i = this.eshots.length - 1; i >= 0; i--) { const s = this.eshots[i]; if (s.kind === 'knot' && Math.abs(s.x - x) < halfW + 0.3) this.eshots.splice(i, 1); }
      if (this.boss && !this.boss.enter && Math.abs(this.boss.x - x) < this.boss.def.halfW + halfW) this.damageBoss(dmg, x);
    }

    updateShots(dt) {
      const ss = this.shots;
      for (let i = ss.length - 1; i >= 0; i--) {
        const s = ss[i]; s.t += dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.zig) s.x += Math.cos(s.t * 22) * 2.2 * dt;
        let dead = s.y > H + 0.5 || Math.abs(s.x) > HW + 0.5;
        if (!dead) {
          const sr = s.r || 0.14;
          for (const e of this.enemies) {
            if (e.state === 'enter' && e.t < 0) continue;
            if (s.hit && s.hit.indexOf(e.id) >= 0) continue;
            const dx = e.x - s.x, dy = e.y - s.y, rr = e.r + sr;
            if (dx * dx + dy * dy < rr * rr) {
              if (s.burst) { this.burst(s.x, s.y, s.burst, s.dmg); dead = true; break; }
              this.damageEnemy(e, s.dmg);
              if (s.chain) this.chainFrom(e, s.chain, s.dmg * s.chainDmg);
              if (s.pierce > 0) { s.pierce--; (s.hit = s.hit || []).push(e.id); } else { dead = true; break; }
            }
          }
        }
        if (!dead) {
          for (let j = this.eshots.length - 1; j >= 0; j--) {
            const k = this.eshots[j]; if (k.kind !== 'knot') continue;
            if (Math.abs(k.x - s.x) < 0.4 && Math.abs(k.y - s.y) < 0.4) { this.eshots.splice(j, 1); this.emit('snip', { x: k.x, y: k.y }); if (!(s.pierce > 0)) dead = true; break; }
          }
        }
        if (!dead && this.boss && !this.boss.enter) {
          const b = this.boss;
          if (Math.abs(s.x - b.x) < b.def.halfW && Math.abs(s.y - b.y) < b.def.halfH * 0.75 && !(s.hit && s.hit.indexOf(-1) >= 0)) {
            if (s.burst) this.emit('burst', { x: s.x, y: s.y, r: s.burst });
            this.damageBoss(s.dmg, s.x);
            if (s.pierce > 0 && !s.burst) { s.pierce--; (s.hit = s.hit || []).push(-1); } else dead = true;
          }
        }
        if (dead) ss.splice(i, 1);
      }
    }
    burst(x, y, r, dmg) {
      this.emit('burst', { x, y, r });
      for (const e of this.enemies.slice()) { const dx = e.x - x, dy = e.y - y; if (dx * dx + dy * dy < (r + e.r) * (r + e.r)) this.damageEnemy(e, dmg); }
    }
    chainFrom(src, jumps, dmg) {
      let from = src; const seen = [src.id];
      for (let j = 0; j < jumps; j++) {
        let best = null, bd = 16;
        for (const e of this.enemies) { if (seen.indexOf(e.id) >= 0) continue; const dd = (e.x - from.x) ** 2 + (e.y - from.y) ** 2; if (dd < bd) { bd = dd; best = e; } }
        if (!best) break;
        this.emit('chain', { x1: from.x, y1: from.y, x2: best.x, y2: best.y });
        seen.push(best.id); const nx = best; this.damageEnemy(best, dmg); from = nx;
      }
    }

    damageEnemy(e, dmg, force) {
      if (e.dead) return;
      if (e.cased && !this.d.pierceCase && !force) { e.cased = false; this.emit('uncase', { id: e.id, x: e.x, y: e.y }); return; }
      e.cased = false;
      e.hp -= dmg; e.hurt = 0.15;
      if (e.hp <= 0.001) this.kill(e); else this.emit('hit', { x: e.x, y: e.y });
    }
    comboMult() { return Math.min(T.comboMax, 1 + Math.floor(this.combo / T.comboStep) * 0.5); }
    kill(e, silent) {
      e.dead = true;
      const i = this.enemies.indexOf(e); if (i >= 0) this.enemies.splice(i, 1);
      if (silent) return;
      const def = e.def, tracing = e.state === 'trace', diving = e.state !== 'form' && e.state !== 'enter';
      const m = this.mods();
      this.combo++; this.comboT = T.comboWindow * (this.p.pattern.second ? 2 : 1);
      this.bestCombo = Math.max(this.bestCombo, this.combo); this.stage.best = Math.max(this.stage.best, this.combo);
      const mult = this.comboMult();
      let pts = tracing ? C.SAMPLER.pts : diving ? def.ptsDive : def.pts;
      if (tracing && this.sampler) this.sampler.hit++;
      if (e.type === 'spinner' && diving && e.escorts && e.escorts.some(x => !x.dead)) pts = def.ptsEscort;
      this.stitches += Math.round(pts * mult);
      this.p.codex.moths[e.type] = (this.p.codex.moths[e.type] || 0) + 1;
      this.emit('kill', { x: e.x, y: e.y, type: e.type, pts: Math.round(pts * mult), mult });
      // drops
      const dust = Math.round(def.dust * (1 + (mult - 1) * 0.5) * (this.fx.gold > 0 ? 2 : 1) * (m.dust || 1));
      this.dropDust(e.x, e.y, dust);
      if (def.silk) this.drop('silk', e.x, e.y, { v: def.silk });
      if (def.packet && this.rand() < def.packet) this.drop('packet', e.x, e.y, {});
      else if (this.rand() < T.charmChance * (m.charms || 1)) this.drop('charm', e.x, e.y, { charm: this.pick(Object.keys(C.CHARMS)) });
      if (this.rand() < T.chartChance * (this.p.pattern.sight ? 2 : 1) * (m.charts || 1)) this.dropChart(e.x, e.y, Object.keys(C.CHARTS).filter(k => C.CHARTS[k].loose));
      if (def.splits && !tracing) for (const s of [-1, 1]) this.spawn('nibbler', { x: e.x + s * 0.5, y: e.y, state: 'dive', vx: s * 2.5, passes: 1 });
      if (e.captive) { this.player.dual = true; this.emit('double', { x: e.x, y: e.y }); }
    }
    dropDust(x, y, total) {
      const n = Math.min(4, total); let left = total;
      for (let i = 0; i < n; i++) { const v = Math.ceil(left / (n - i)); left -= v; this.drop('dust', x + this.rr(-0.3, 0.3), y + this.rr(-0.2, 0.2), { v }); }
    }
    drop(kind, x, y, o) { this.drops.push(Object.assign({ id: this.nextId++, kind, x: clamp(x, -HW + 0.4, HW - 0.4), y, vx: this.rr(-0.6, 0.6), t: 0 }, o)); }
    dropChart(x, y, pool) {
      const open = pool.filter(id => !this.p.charts[id] && !this.drops.some(d => d.chart === id));
      if (open.length) this.drop('chart', x, y, { chart: open[0] === pool[0] && pool.length === open.length ? open[0] : this.pick(open), keeper: false });
    }

    // ---------- the Moth Host ----------
    updateEnemies(dt, rawDt) {
      const pl = this.player, playing = this.phase === 'play';
      const slotted = this.enemies.filter(e => e.slot);
      // dive scheduler
      if (playing && !this.boss && !this.sampler) {
        this.diveT -= dt;
        if (this.diveT <= 0) {
          const formed = slotted.filter(e => e.state === 'form');
          const pace = this.spec.diveEvery * (0.55 + 0.45 * Math.min(1, slotted.length / 20));
          this.diveT = pace * this.rr(0.8, 1.2);
          if (formed.length) this.launch(this.pick(formed), formed);
        }
        this.fireT -= dt;
        if (this.fireT <= 0) {
          this.fireT = this.spec.fireEvery * this.rr(0.7, 1.3);
          const f = slotted.filter(e => e.state === 'form' && (e.type === 'spinner' || e.type === 'casebearer' || e.type === 'lappet'));
          if (f.length) { const e = this.pick(f); this.eshot(e.type === 'spinner' ? 'silk' : 'frass', e.x, e.y - 0.4, 0, e.type === 'spinner' ? -4.2 : -5); }
        }
        if (this.extras.length) {
          if (!slotted.length) this.extras.length = 0;
          else { this.extraT -= dt; if (this.extraT <= 0) { this.extraT = this.rr(3.5, 6); this.spawnExtra(this.extras.pop()); } }
        }
      }
      for (const e of this.enemies.slice()) {
        if (e.dead) continue;
        e.flap += rawDt * (e.state === 'form' ? 6 : 14);
        if (e.hurt) e.hurt = Math.max(0, e.hurt - rawDt);
        const def = e.def;
        switch (e.state) {
          case 'enter': {
            e.t += dt / 1.5;
            const s = this.slotPos(e), u = clamp(e.t, 0, 1), v = 1 - u;
            e.x = v * v * e.ex + 2 * v * u * e.cx + u * u * s.x; e.y = v * v * e.ey + 2 * v * u * e.cy + u * u * s.y;
            if (e.t < 0) { e.x = e.ex; e.y = e.ey; }
            if (e.t >= 1) e.state = 'form';
            break;
          }
          case 'form': { const s = this.slotPos(e); e.x = s.x; e.y = s.y; break; }
          case 'trace': {      // Sampler: fly in, trace the figure once, fly off. They never fire.
            e.t += dt;
            if (e.t < 0) break;
            const a = this.pathPoint(e.pattern, 0), lap = 1 / C.SAMPLER.speed;
            if (e.t < 1) { const k = e.t, q = k * k * (3 - 2 * k); e.x = (HW + 2) + (a.x - HW - 2) * q; e.y = (H + 1) + (a.y - H - 1) * q; }
            else if (e.t < 1 + lap) { const pt = this.pathPoint(e.pattern, (e.t - 1) / lap); e.vx = (pt.x - e.x) / Math.max(dt, 1e-4); e.x = pt.x; e.y = pt.y; }
            else { e.y += 9 * dt; e.x += 3 * dt; if (e.y > H + 1.5) { this.sampler.out++; this.kill(e, true); } }
            break;
          }
          case 'windup': {
            const s = this.slotPos(e); e.x = s.x + Math.sin(this.t * 40) * 0.05; e.y = s.y; e.t -= dt;
            if (e.t <= 0) { e.state = e.next; e.mark = null; e.vx = 0; }
            break;
          }
          case 'dive': {
            e.t += dt;
            e.vx = clamp(e.vx + clamp((pl.x - e.x) * 2.2, -7, 7) * dt, -3.6, 3.6);
            e.x += (e.vx + Math.sin(e.t * def.wob) * def.wobAmp) * dt;
            e.y -= def.diveSpeed * dt;
            e.x = clamp(e.x, -HW + 0.4, HW - 0.4);
            e.shotT -= dt;
            if (e.shotT <= 0 && e.y > 5 && playing) { e.shotT = def.shotEvery; this.eshot(e.type === 'spinner' ? 'silk' : 'frass', e.x, e.y - 0.3, 0, -6.2); }
            if (e.y < -1) {
              if (e.slot) { e.y = H + 1; e.state = 'return'; }
              else if (e.passes-- > 0) { e.y = H + 1; e.x = this.rr(-5, 5); }
              else this.kill(e, true);
            }
            break;
          }

    resize() {

    // ---------- the needle and its thread ----------

    setNeedle(name) {

    // ---------- yarn effects ----------

    }

    }
    unravel(x, y, colors, n, power) { for (let i = 0; i < n; i++) this.strand(x + (Math.random() - 0.5) * 0.4, y + (Math.random() - 0.5) * 0.4, colors[i % colors.length], { speed: (1.5 + Math.random() * 4) * (power || 1) }); }

    handleEvents(events, sim) {

          case 'uncase': this.unravel(e.x, e.y - 0.3, [PAL.linen, PAL.tan], 7, 0.6); break;

          case 'burst': this.loop(e.x, e.y, e.r, PAL.madderHi); this.loop(e.x, e.y, e.r * 0.6, PAL.madderPale); this.unravel(e.x, e.y, [PAL.knot, PAL.madder, PAL.madderHi], 14, 1.3); break;

            this.loop(e.x, e.y, 7, PAL.glare); this.loop(e.x, e.y, 4, PAL.saffron); this.sparks(e.x, e.y, PAL.glare, 40); this.shake = 0.7;

        case 'pk': this.pk = +arg; this.unpickArm = -1; this.pockets(); break;
        case 'open': { const inp = $('#mender', this.el.overlay); c.openPocket(this.pk, inp ? inp.value : ''); break; }
        case 'copy': { const to = c.store.slots().findIndex(x => !x); if (to >= 0 && c.store.copy(this.pk, to)) { this.pk = to; } this.pockets(); break; }
        case 'unpick': if (this.unpickArm === this.pk) { c.store.unpick(this.pk); if (c.slot === this.pk) { c.slot = -1; c.profile = ST.save.freshProfile(); } this.unpickArm = -1; } else this.unpickArm = this.pk; this.pockets(); break;
        case 'ledger': this.ledgerFilter = arg || 'all'; this.ledger(); break;
        case 'patch': this.patchSel = arg; this.route(); break;
        case 'fly': c.flyPatch(arg); break;
        case 'how': this.how(); break;
        case 'notion': c.useNotion(+arg); break;
        case 'swap': c.swap(); break;
        case 'pause': c.pause(); break;
      }
    }

    // ---------- title, pockets, main menu ----------
    title() {
      this.show(`<div class="title">
        <div class="eyebrow">A yarn-stitched arcade shooter</div>
        <h1 class="wordmark">String Theory</h1>
        <p class="lede">Fly your needle ship, shoot down the moth swarm, beat the bosses, and spend what you earn on new weapons, ships and upgrades.</p>
        <div class="stack"><button class="btn primary" data-act="pockets" data-focus>Play</button></div></div>`, 'night');
    }
    pockets() {
      const c = this.ctl, slots = c.store.slots();
      if (this.pk === undefined || this.pk < 0) this.pk = c.slot >= 0 ? c.slot : c.store.last();
      const nN = Object.keys(C.NEEDLES).length, nP = Object.keys(C.PATTERN.nodes).length;
      const cards = slots.map((p, i) => p ? `<button class="pcard ${i === this.pk ? 'sel' : ''}" data-act="pk" data-arg="${i}">

          <span class="pneedles">${Object.keys(C.NEEDLES).filter(n => p.needles[n]).map(n => icon(n, 18)).join('')}</span>
          <dl><div><dt>Gems</dt><dd>${num(p.silk)}</dd></div><div><dt>Coins</dt><dd>${num(p.dust)}</dd></div><div><dt>Best score</dt><dd>${num(p.stats.bestNight)}</dd></div>
          <div><dt>Ships</dt><dd>${Object.keys(p.needles).length} of ${nN}</dd></div><div><dt>Perks</dt><dd>${Object.keys(p.pattern).length} of ${nP}</dd></div></dl></button>`
        : `<button class="pcard empty ${i === this.pk ? 'sel' : ''}" data-act="pk" data-arg="${i}">${icon('sharps', 26)}<b class="pname">Empty slot</b><span>Start a new game</span></button>`).join('');
      const cur = slots[this.pk], hasEmpty = slots.some(x => !x);
      const actions = cur ? `<button class="btn primary" data-act="open" data-focus>Load</button>
          <button class="btn" data-act="copy" ${hasEmpty ? '' : 'disabled'}>Copy to empty slot</button>
          <button class="btn danger" data-act="unpick">${this.unpickArm === this.pk ? 'Tap again to delete ' + esc(cur.mender) : 'Delete'}</button>`
        : `<label class="namer"><span class="eyebrow">Player name</span><input id="mender" maxlength="14" value="Player" autocomplete="off"></label><button class="btn primary" data-act="open" data-focus>Start a new game</button>`;
      this.show(`<div class="sheet wide"><div class="eyebrow">Save slots</div><h2>Choose a save</h2>
        <div class="pockets">${cards}</div><div class="row">${actions}</div>
        <p class="dim small">Records keep every finished run, even from deleted saves.</p></div>`, 'paper');
    }
    menu() {
      const p = this.p, st = p.settings;
      this.show(`<div class="title">
        <div class="eyebrow">Playing as ${esc(p.mender)}</div>
        <h1 class="wordmark">String Theory</h1>
        <div class="stack">
          <button class="btn primary" data-act="begin" data-focus>Start run</button>
          <button class="btn" data-act="hem">Hideout (shop)</button>
          <button class="btn" data-act="ledger">Records</button>
          <button class="btn" data-act="how">How to play</button>
          <button class="btn" data-act="pockets">Change save</button>
        </div>
        <div class="row purse">${dustTag(p.dust)}${silkTag(p.silk)}<span class="mono dim">Best score ${num(p.stats.bestNight)} · Runs ${p.stats.nights} · completed ${p.stats.mended}</span></div>
        <div class="row small">
          <button class="chip" data-act="toggle" data-arg="sound">Sound: ${st.sound ? 'on' : 'off'}</button>
          <button class="chip" data-act="toggle" data-arg="autofire">Auto-fire: ${st.autofire ? 'on' : 'off'}</button>
          <button class="chip" data-act="toggle" data-arg="shadows">Shadows: ${st.shadows ? 'on' : 'off'}</button>
        </div></div>`, 'night');
    }

    // ---------- the Night's route ----------
    route() {
      const sim = this.ctl.sim, cur = sim.panel, opts = C.PANELS[cur].patches;
      if (opts.indexOf(this.patchSel) < 0) this.patchSel = opts[0];
      const cols = C.PANELS.map((pn, i) => `<div class="rcol ${i > cur ? 'future' : ''}"><span class="eyebrow">${pn.name.replace('Panel ', '')}</span>${pn.patches.map(id => { const pt = C.PATCHES[id];
        const flown = i < cur && (sim.route[i] === id || pn.patches.length === 1), here = i === cur;
        return `<button class="ptile art-${pt.art} ${flown ? 'flown' : ''} ${here ? 'open' : ''} ${here && id === this.patchSel ? 'sel' : ''}" ${here ? `data-act="patch" data-arg="${id}" aria-pressed="${id === this.patchSel}"` : 'disabled'}><i></i><b>${esc(pt.name)}</b></button>`; }).join('')}</div>`).join('');
      const pt = C.PATCHES[this.patchSel], k = C.KEEPERS[C.PANELS[cur].keeper];
      this.show(`<div class="hem"><header><div><div class="eyebrow">${C.PANELS[cur].name} of ${C.PANELS.length}</div><h2>Route map</h2></div></header>
        <div class="routewrap"><div><div class="routemap">${cols}</div><div class="hemline">You visit the hideout after every stage</div></div>
        <div class="detail"><div class="eyebrow">${C.PANELS[cur].name} · ${opts.length > 1 ? 'choose your route' : 'only one route'}</div><h3>${esc(pt.name)}</h3><p>${esc(pt.desc)}</p>
          <dl class="tally"><div><dt>Waves</dt><dd>Wave 1 · Wave 2 · Bonus wave · Boss</dd></div><div><dt>Boss</dt><dd>${esc(k.name)}</dd></div>${pt.mark ? `<div><dt class="mark">Bonus</dt><dd class="mark">${esc(pt.mark)}</dd></div>` : ''}</dl>
          <div class="buyrow"><button class="btn primary" data-act="fly" data-arg="${this.patchSel}" data-focus>Go</button></div></div></div></div>`, 'paper');
    }

    // ---------- the Ledger ----------
    ledger() {
      const c = this.ctl, f = this.ledgerFilter || 'all', p = this.p;
      const rows = c.store.ledger().filter(r => f === 'all' || r.needle === f).slice(0, 12);
      const tabs = [['all', 'All ships']].concat(Object.keys(C.NEEDLES).map(n => [n, C.NEEDLES[n].name]));
      const body = rows.length ? rows.map((r, i) => `<tr class="${r.mender === p.mender ? 'me' : ''}"><td>${i + 1}</td><td>${esc(r.mender)}</td><td>${esc((C.NEEDLES[r.needle] || { name: r.needle }).name)}</td><td class="mono">${num(r.stitches)}</td><td class="${r.won ? 'won' : ''}">${esc(r.reached)}</td><td>${esc(r.date)}</td></tr>`).join('')
        : '<tr><td colspan="6" class="dim">No runs on record yet.</td></tr>';
      const marks = [['Perfect bonus waves', p.stats.perfectSamplers || 0]].concat(Object.keys(C.KEEPERS).map(id => [C.KEEPERS[id].name + ' defeated', p.codex.keepers[id] || 0]), [['Longest twin-ship streak', (p.stats.longestDouble || 0) + ' waves']]);
      this.show(`<div class="hem"><header><div><div class="eyebrow">High scores</div><h2>Records</h2></div></header>
        <nav class="tabs">${tabs.map(t => `<button class="tabb ${t[0] === f ? 'on' : ''}" data-act="ledger" data-arg="${t[0]}"><b>${t[1]}</b></button>`).join('')}</nav>
        <div class="routewrap"><div class="tablewrap"><table class="ledger"><tr><th>#</th><th>Player</th><th>Ship</th><th>Score</th><th>Reached</th><th>Date</th></tr>${body}</table></div>
        <div class="detail"><div class="eyebrow">${esc(p.mender)}'s stats</div><dl class="tally">${marks.map(m => `<div><dt>${esc(m[0])}</dt><dd>${m[1]}</dd></div>`).join('')}</dl></div></div>
        <footer><span></span><button class="btn primary" data-act="title" data-focus>Back</button></footer></div>`, 'paper');
    }
    how() {
      this.show(`<div class="sheet"><div class="eyebrow">Controls</div><h2>How to play</h2>
        <div class="how">
          <div><b>Move</b><span><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> · drag on the cloth</span></div>
          <div><b>Fire</b><span>Automatic, or hold <kbd>Space</kbd> with auto-fire off</span></div>
          <div><b>Use an item</b><span><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> · tap an item slot</span></div>
          <div><b>Swap weapon</b><span><kbd>Q</kbd> (Chenille ship only)</span></div>
          <div><b>Dash</b><span><kbd>Shift</kbd> or double-tap (Between ship only)</span></div>
          <div><b>Pause</b><span><kbd>Esc</kbd> or <kbd>P</kbd></span></div>
        </div>
        <p>A run is five stages. Each stage is two waves of enemies, a bonus wave where the moths fly a pattern and never shoot back, and then a boss. After every stage you visit the hideout to shop, then pick your route to the next stage.</p>
        <p>Shoot enemies quickly to build a combo: it multiplies your score and the coins they drop. Coins buy weapons, upgrades and single-use items. Gems, from Spinners and bosses, buy new ships and permanent perks. Blueprints dropped by enemies and bosses unlock new things in the shop. Everything you buy is saved.</p>
        <div class="row"><button class="btn primary" data-act="title" data-focus>Back</button></div></div>`, 'paper');
    }

    // ---------- the Hem ----------
    hem() {
      const p = this.p, c = this.ctl, mid = c.midNight;
      const tabs = [['spool', 'Weapons', 'buy and level up'], ['bench', 'Upgrades', 'permanent ship stats'], ['notions', 'Items', 'single use']];
      if (!mid) tabs.push(['case', 'Ships', 'buy with gems'], ['pattern', 'Perks', 'permanent bonuses']);
      tabs.push(['book', 'Collection', 'blueprints and enemies']);
      if (!tabs.some(t => t[0] === this.tab)) this.tab = 'spool';
      const sub = mid ? `${C.PANELS[c.sim.panel - 1].name} cleared \u00b7 next: ${C.PANELS[c.sim.panel].name}. Ships and perks open between runs.` : 'Between runs \u00b7 everything you buy is saved';
      const body = this['st_' + this.tab]();
      this.show(`<div class="hem">
        <header><div><div class="eyebrow">${esc(sub)}</div><h2>Hideout</h2></div>
          <div class="row purse">${dustTag(p.dust)}${silkTag(p.silk)}</div></header>
        <nav class="tabs">${tabs.map(t => `<button class="tabb ${t[0] === this.tab ? 'on' : ''}" data-act="tab" data-arg="${t[0]}"><b>${t[1]}</b><span>${t[2]}</span></button>`).join('')}</nav>
        <div class="station">${body}</div>
        <footer><button class="btn" data-act="${mid ? 'abandon' : 'title'}">${mid ? 'End run' : 'Main menu'}</button>
          <button class="btn primary" data-act="depart">${mid ? 'Continue run' : 'Start run'}</button></footer></div>`, 'paper');
    }
    stateLine(st, cur) {
      const unit = cur === 'silk' ? 'gems' : 'coins', have = this.p[cur];
      if (st.why === 'sealed') return '<span class="state sealed">Locked · find its blueprint</span>';
      if (st.why === 'locked') return '<span class="state sealed">Unlock the one before it first</span>';
      if (st.why === 'short') return `<span class="state short">Need ${num(st.price - have)} more ${unit}</span>`;
      if (st.why === 'full') return '<span class="state short">Item slots full</span>';
      if (st.why === 'visit') return '<span class="state short">One per visit</span>';
      if (st.why === 'owned') return '<span class="state own">Owned</span>';
      return '';
    }
    priceTag(st, cur) { return st.price !== undefined ? (cur === 'silk' ? silkTag(st.price) : dustTag(st.price)) : ''; }
    list(items, selId) { return `<div class="list">${items.map(i => `<button class="card ${i.id === selId ? 'sel' : ''} ${i.dim ? 'dim' : ''}" data-act="pick" data-arg="${i.id}"><span class="cic">${i.icon || ''}</span><span class="cname">${esc(i.name)}</span><span class="cmeta">${i.meta || ''}</span></button>`).join('')}</div>`; }
    detail(o) {
      return `<div class="detail"><div class="eyebrow">${esc(o.kicker || '')}</div><h3>${esc(o.name)}</h3><p>${esc(o.desc)}</p>${o.extra || ''}
        <div class="buyrow">${o.state || ''}${o.buttons || ''}</div>${o.quote ? `<p class="quote">“${esc(o.quote)}”</p>` : ''}</div>`;
    }
    st_spool() {
      const p = this.p, ids = Object.keys(C.THREADS), sel = this.sel.spool && C.THREADS[this.sel.spool] ? this.sel.spool : p.thread;
      const items = ids.map(id => { const t = C.THREADS[id], w = p.threads[id], st = S.threadState(p, id);
        return { id, name: t.name, icon: `<i class="spool" style="--c:${t.color}"></i>`, dim: st.why === 'sealed',
          meta: w ? (p.thread === id ? 'Equipped' : p.thread2 === id ? 'Second weapon' : 'Owned') + ' · Level ' + ROMAN[w] : st.why === 'sealed' ? 'Locked' : dustTag(t.price) }; });
      const t = C.THREADS[sel], w = p.threads[sel] || 0, st = S.threadState(p, sel);
      const weights = `<ol class="weights">${t.weights.map((d, i) => `<li class="${i < w ? 'on' : ''}"><b>${ROMAN[i + 1]}</b> ${esc(d)}${i > 0 ? ` <span class="mono dim">+${C.WEIGHT_COST[i]}</span>` : ''}</li>`).join('')}</ol>`;
      let btn = '';
      if (st.ok) btn += `<button class="btn primary" data-act="buy" data-arg="thread:${sel}">${st.why === 'buy' ? 'Buy' : 'Upgrade to level ' + ROMAN[st.next]} · ${num(st.price)}</button>`;
      if (w && p.thread !== sel) btn += `<button class="btn" data-act="wind" data-arg="${sel}">Equip</button>`;
      if (w && p.thread !== sel && p.needle === 'chenille' && p.thread2 !== sel) btn += `<button class="btn" data-act="wind2" data-arg="${sel}">Equip as second weapon</button>`;
      return this.list(items, sel) + this.detail({ kicker: 'Weapon · bought with coins, kept forever', name: t.name, desc: t.desc, extra: weights,
        state: this.stateLine(st, 'dust') + (st.why === 'short' ? this.priceTag(st, 'dust') : ''), buttons: btn,
        quote: '' });
    }
    st_bench() {
      const p = this.p, ids = Object.keys(C.TEMPERS), sel = this.sel.bench && C.TEMPERS[this.sel.bench] ? this.sel.bench : 'point';
      const n = C.NEEDLES[p.needle], d = ST.derive(p);
      const items = ids.map(id => { const t = C.TEMPERS[id], lv = p.tempers[id], st = S.temperState(p, id);
        return { id, name: t.name, icon: pips(lv, t.max), meta: lv >= t.max ? 'Maxed' : st.why === 'sealed' ? 'Level IV locked' : 'Next ' + dustTag(st.price) }; });
      const t = C.TEMPERS[sel], st = S.temperState(p, sel);
      const stats = `<div class="stats">${['ply', 'pace', 'eye', 'point'].map(k => `<div><span>${k}</span>${pips(d.pips[k], 8)}</div>`).join('')}</div>`;
      return this.list(items, sel) + this.detail({ kicker: 'Upgrade · permanent, applies to every ship', name: t.name + ' ' + ROMAN[Math.min(t.max, p.tempers[sel] + 1)], desc: t.desc + '.', extra: stats,
        state: this.stateLine(st, 'dust') + (st.why === 'short' ? this.priceTag(st, 'dust') : ''),
        buttons: st.ok ? `<button class="btn primary" data-act="buy" data-arg="temper:${sel}">Upgrade · ${num(st.price)}</button>` : '',
        quote: '' });
    }
    st_notions() {
      const p = this.p, ids = Object.keys(C.NOTIONS), sel = this.sel.notions && C.NOTIONS[this.sel.notions] ? this.sel.notions : 'thimble', visit = this.ctl.visit;
      const items = ids.map(id => { const n = C.NOTIONS[id], st = S.notionState(p, id, visit), price = S.notionPrice(p, id), have = S.trayCount(p, id);
        return { id, name: n.name, icon: icon(n.sprite, 30), dim: st.why === 'sealed',
          meta: st.why === 'sealed' ? 'Locked' : dustTag(price) + (price < n.price ? ` <s class="mono dim">${n.price}</s>` : '') + (have ? ` <span class="mono">×${have}</span>` : '') }; });
      const n = C.NOTIONS[sel], st = S.notionState(p, sel, visit);
      const tray = `<div class="trayrow"><span class="eyebrow">Your item slots</span>${[0, 1, 2].map(i => { const s = p.tray[i]; return `<span class="slot">${s ? icon(C.NOTIONS[s.id].sprite, 30) + (s.n > 1 ? `<em>×${s.n}</em>` : '') : ''}<kbd>${i + 1}</kbd></span>`; }).join('')}</div>`;
      return this.list(items, sel) + this.detail({ kicker: 'Item · single use, three slots', name: n.name, desc: n.desc, extra: tray,
        state: this.stateLine(st, 'dust') + (st.why === 'short' ? this.priceTag(st, 'dust') : ''),
        buttons: st.ok ? `<button class="btn primary" data-act="buy" data-arg="notion:${sel}">Buy · ${num(st.price)}</button>` : '',
        quote: '' });
    }
    st_case() {
      const p = this.p, ids = Object.keys(C.NEEDLES), sel = this.sel.case && C.NEEDLES[this.sel.case] ? this.sel.case : p.needle;
      const items = ids.map(id => { const n = C.NEEDLES[id], st = S.needleState(p, id);
        return { id, name: n.name, icon: icon(id, 26), dim: st.why === 'sealed', meta: p.needle === id ? 'Flying' : p.needles[id] ? 'Owned' : st.why === 'sealed' ? 'Locked' : silkTag(n.price) }; });
      const n = C.NEEDLES[sel], st = S.needleState(p, sel), base = C.NEEDLES.sharps;
      const stats = `<div class="stats">${['ply', 'pace', 'eye', 'point'].map(k => { const dv = n[k] - base[k]; return `<div><span>${k}</span>${pips(n[k], 5)}<em class="mono">${dv ? (dv > 0 ? '+' : '') + dv : ''}</em></div>`; }).join('')}</div><div class="eyebrow">Compared with the starter ship</div>`;
      let btn = st.ok ? `<button class="btn primary" data-act="buy" data-arg="needle:${sel}">Buy for ${st.price} gems</button>` : '';
      if (p.needles[sel] && p.needle !== sel) btn += `<button class="btn primary" data-act="takeup" data-arg="${sel}">Fly this ship</button>`;
      const sealed = st.why === 'sealed' ? `<p class="state sealed">${esc(n.name)} is locked until you find its blueprint. Dropped by: ${esc(C.CHARTS[n.chart].from)}.</p>` : '';
      return this.list(items, sel) + this.detail({ kicker: 'Ship · bought with gems, kept forever', name: n.name, desc: n.trait + ': ' + n.traitDesc, extra: stats + sealed,
        state: (st.why === 'sealed' ? '' : this.stateLine(st, 'silk')) + (st.why === 'short' ? this.priceTag(st, 'silk') : ''), buttons: btn,
        quote: '' });
    }
    st_pattern() {
      const p = this.p, all = C.PATTERN.nodes, sel = this.sel.pattern && all[this.sel.pattern] ? this.sel.pattern : 'steady';
      const done = Object.keys(all).filter(k => p.pattern[k]).length;
      const grid = `<div class="sampler">${C.PATTERN.rows.map(r => `<div class="srow"><span class="eyebrow">${r.name}</span>${r.nodes.map(id => { const st = S.patternState(p, id);
        return `<button class="node ${p.pattern[id] ? 'done' : ''} ${st.why === 'locked' ? 'lock' : ''} ${id === sel ? 'sel' : ''}" data-act="pick" data-arg="${id}"><b>${esc(all[id].name)}</b><span>${p.pattern[id] ? 'Unlocked' : all[id].cost + ' gems'}</span></button>`; }).join('')}</div>`).join('')}</div>`;
      const n = all[sel], st = S.patternState(p, sel);
      return grid + this.detail({ kicker: `Perk · ${done} of 12 unlocked`, name: n.name, desc: n.desc,
        extra: '<p class="dim">Permanent. Applies to every run and every ship.</p>',
        state: (st.why === 'owned' ? '<span class="state own">Unlocked</span>' : this.stateLine(st, 'silk')) + (st.why === 'short' ? this.priceTag(st, 'silk') : ''),
        buttons: st.ok ? `<button class="btn primary" data-act="buy" data-arg="pattern:${sel}">Unlock · ${st.price} gems</button>` : '',
        quote: '' });
    }
    st_book() {
      const p = this.p;
      const charts = Object.keys(C.CHARTS).map(id => { const c = C.CHARTS[id], got = p.charts[id];
        return `<div class="entry ${got ? '' : 'unseen'}">${icon('chart', 30)}<div><b>${got ? esc(c.name) : 'Not yet found'}</b><span>${got ? 'Unlocks ' + esc(c.unseals) : 'Dropped by ' + esc(c.from)}</span></div></div>`; }).join('');
      const moths = Object.keys(C.MOTHS).map(id => { const m = C.MOTHS[id], n = p.codex.moths[id] || 0;
        return `<div class="entry ${n ? '' : 'unseen'}">${icon(m.sprite, 40)}<div><b>${n ? esc(m.name) : 'Not yet seen'}</b><span>${n ? esc(m.note) + ' Destroyed: ' + num(n) : ''}</span></div></div>`; }).join('');
      const keepers = Object.keys(C.KEEPERS).map(id => { const k = C.KEEPERS[id], n = p.codex.keepers[id] || 0;
        return `<div class="entry ${n ? '' : 'unseen'}">${icon(k.sprite, 64)}<div><b>${n ? esc(k.name) : 'Not yet defeated'}</b><span>${n ? 'Weak spot: ' + esc(k.softName) + '. Defeated: ' + n : ''}</span></div></div>`; }).join('');
      const found = Object.keys(C.CHARTS).filter(k => p.charts[k]).length;
      return `<div class="book"><section><div class="eyebrow">Blueprints · ${found} of ${Object.keys(C.CHARTS).length}</div>${charts}</section>
        <section><div class="eyebrow">Enemies</div>${moths}<div class="eyebrow">Bosses</div>${keepers}</section></div>`;
    }
    buy(arg) {

    }

    loop(ts) {

          case 'fire': if (!fired) { fired = true; this.sfx('fire'); } break;

          case 'kill': this.sfx('kill'); if (e.mult > 1 || e.pts >= 200) ui.floater(r.project(e.x, e.y), '+' + e.pts, e.mult > 1 ? 'hot' : ''); break;
          case 'dust': this.sfx('dust'); break;
          case 'silk': this.sfx('silk'); ui.floater(r.project(sim.player.x, 2.6), '+' + e.v + (e.v === 1 ? ' gem' : ' gems'), 'silk'); break;
          case 'charm': this.sfx('charm'); ui.toast(e.name, e.desc); break;
          case 'chart': this.sfx('chart'); ui.toast('Blueprint found', 'Unlocks ' + e.unseals + ' in the hideout'); break;
          case 'packet': this.sfx('charm'); ui.toast('Item found', e.name); break;
          case 'notion': this.sfx('buy'); ui.toast(e.name, C.NOTIONS[e.id].desc); break;
          case 'slip': this.sfx('charm'); ui.toast(e.why, 'Capture beam blocked.'); break;
          case 'captured': this.sfx('hurt'); ui.toast('Captured!', e.dual ? 'Your twin ship was taken.' : 'You lost a life. Destroy that Spinner to get the ship back as a twin.'); break;
          case 'double': this.sfx('chart'); ui.toast('Twin ship', 'Ship rescued. Two ships, double fire, until one is hit.'); break;
          case 'thimble': this.sfx('hit'); ui.toast('Thimble', 'Hit blocked.'); break;
          case 'hurt': case 'undouble': this.sfx('hurt'); break;
          case 'spare': this.sfx('hurt'); ui.banner('Life lost', e.spares + (e.spares === 1 ? ' life left' : ' lives left'), 1400); break;
          case 'lastknot': this.sfx('chart'); ui.banner('Second Chance', 'You survive with 1 shield', 1500); break;
          case 'snap': this.sfx('snap'); break;
          case 'phase': this.sfx('phase'); ui.banner(e.tag, e.name + ' · Phase ' + e.phase, 1500); break;
          case 'keeperdown': this.sfx('keeper'); ui.banner(e.name, 'Boss defeated', 2000); break;
          case 'lance': this.sfx('lance'); break;
          case 'burst': this.sfx('burst'); break;
          case 'stageclear': if (e.last) this.closeBook(); this.saved(); this.state = 'tally'; this.pocket = e.info.kind === 'row' ? this.rollPocket() : null; setTimeout(() => { if (this.state === 'tally') this.ui.tally(e, this.pocket); }, 300); break;

    rollPocket() {
      const ids = Object.keys(C.NOTIONS).filter(id => { const n = C.NOTIONS[id]; return !n.perVisit && (!n.chart || this.profile.charts[n.chart]); });
