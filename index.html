<script type="module">
  // Three.js r170: a local copy first (offline / packaged builds), then the CDNs.
  const urls = ['./vendor/three.module.min.js', 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js', 'https://unpkg.com/three@0.170.0/build/three.module.min.js'];
  let THREE = window.__THREE_STUB__ || null;
  for (const u of urls) { if (THREE) break; try { THREE = await import(u); } catch (e) { THREE = null; } }
  window.ST.boot(THREE);
</script>
